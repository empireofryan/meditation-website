name: Deploy to GitHub Pages

on:
  # Trigger on push to main
  push:
    branches: [main]
  # Trigger from Google Sheets webhook
  repository_dispatch:
    types: [spreadsheet-update]
  # Allow manual trigger
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          VITE_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: empireofryan/empireofryan.github.io
          publish_branch: main
          publish_dir: ./dist
